<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main background -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="300"
      gradientUnits="userSpaceOnUse">

      <stop offset="0%" stop-color="#E8EAF6"/>
      <stop offset="45%" stop-color="#EDE7F6"/>
      <stop offset="75%" stop-color="#E8DFF0"/>
      <stop offset="100%" stop-color="#DCC7D9"/>

    </linearGradient>

    <!-- Blue glow -->
    <radialGradient
      id="blueGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(180 50) rotate(35) scale(380 220)">

      <stop
        offset="0%"
        stop-color="#B8C7F5"
        stop-opacity="0.65"/>

      <stop
        offset="100%"
        stop-color="#B8C7F5"
        stop-opacity="0"/>

    </radialGradient>

    <!-- Pink glow -->
    <radialGradient
      id="pinkGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1050 70) rotate(145) scale(360 220)">

      <stop
        offset="0%"
        stop-color="#E7B8D3"
        stop-opacity="0.55"/>

      <stop
        offset="100%"
        stop-color="#E7B8D3"
        stop-opacity="0"/>

    </radialGradient>

  </defs>


  <!-- ===================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================== -->

  <rect
    width="1200"
    height="300"
    rx="18"
    fill="url(#background)"
  />


  <!-- ===================================== -->
  <!-- SOFT GLOWS -->
  <!-- ===================================== -->

  <ellipse
    cx="180"
    cy="50"
    rx="380"
    ry="220"
    fill="url(#blueGlow)"
  />

  <ellipse
    cx="1050"
    cy="70"
    rx="360"
    ry="220"
    fill="url(#pinkGlow)"
  />


  <!-- ===================================== -->
  <!-- DECORATIVE LOWER WAVE -->
  <!-- ===================================== -->

  <path
    d="
      M0 245
      C190 185 370 275 570 230
      C770 185 960 235 1200 165
      L1200 300
      L0 300
      Z
    "
    fill="#FFFFFF"
    fill-opacity="0.38"
  />


  <!-- Thin wave line -->

  <path
    d="
      M0 258
      C210 205 390 290 590 238
      C790 188 980 245 1200 185
    "
    stroke="#7C6A9B"
    stroke-opacity="0.28"
    stroke-width="2"
    fill="none"
  />


  <!-- ===================================== -->
  <!-- DECORATIVE DOTS -->
  <!-- ===================================== -->

  <circle
    cx="105"
    cy="75"
    r="4"
    fill="#7184C8"
    fill-opacity="0.65"
  />

  <circle
    cx="1080"
    cy="65"
    r="5"
    fill="#A86D91"
    fill-opacity="0.55"
  />

  <circle
    cx="1125"
    cy="105"
    r="3"
    fill="#7184C8"
    fill-opacity="0.60"
  />

  <circle
    cx="95"
    cy="215"
    r="3"
    fill="#A86D91"
    fill-opacity="0.45"
  />


  <!-- ===================================== -->
  <!-- MAIN NAME -->
  <!-- ===================================== -->

  <text
    x="600"
    y="118"
    text-anchor="middle"
    fill="#202033"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="700">

    Kirtika Singh

  </text>


  <!-- ===================================== -->
  <!-- PROFESSIONAL HEADLINE -->
  <!-- ===================================== -->

  <text
    x="600"
    y="164"
    text-anchor="middle"
    fill="#303047"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="600">

    Data Analyst | AI &amp; ML Learner | Web Developer

  </text>


  <!-- ===================================== -->
  <!-- SUPPORTING LINE -->
  <!-- ===================================== -->

  <text
    x="600"
    y="204"
    text-anchor="middle"
    fill="#55516A"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="500">

    Building with Data • Building for the Web • Learning AI &amp; ML

  </text>


</svg>
